[project]
name = "jarvis-voice"
version = "0.1.0"
description = "Local speech for Jarvis: wake word, speech to text and voice"
requires-python = ">=3.12,<3.13"
dependencies = [
  "faster-whisper",
  "sherpa-onnx",
  "piper-tts",
  "openwakeword",
  "onnxruntime",
  "soundfile",
  "numpy",
  "kokoro-onnx>=0.6.1",
]

[tool.uv]
package = false
